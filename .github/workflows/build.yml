name: Build Mod

# 云端编译 ModIntegratedStorageCpp —— 本地零依赖，push 即出 dll。
# 使用 CMake 构建（匹配 RE-UE4SS 官方 CI），runner 自带 VS 2026 + MSVC 14.51。
# RE-UE4SS 固定 commit c838a8ac（匹配已安装的 UE4SS v3.0.1 Beta）。

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'dist/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  RE_UE4SS_COMMIT: c838a8acaade1a0f860bdf249f039e58f4e10088
  MOD_NAME: ModIntegratedStorageCpp
  CONFIG: Game__Shipping__Win64

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "18"

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Calculate cache key
        id: cache_key
        shell: pwsh
        run: |
          $commit = $env:RE_UE4SS_COMMIT
          $week = Get-Date -Format 'yyyyWW'
          echo "key=cmake-deps-${commit}-W${week}" >> $env:GITHUB_OUTPUT

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: |
            build_cmake_shared_deps/_deps
            build_cmake_shared_deps/ep_downloads
          key: ${{ steps.cache_key.outputs.key }}
          restore-keys: |
            cmake-deps-

      - name: Clone RE-UE4SS (pinned commit, with submodules)
        shell: pwsh
        run: |
          # NOTE: UEPseudo submodule is private and cannot be fetched on forks.
          # Only the public submodule (patternsleuth) is init'ed here; the
          # UEPseudo (deps/first/Unreal) contents are pulled from a public
          # v3.0.1 rehost mirror in the next step.
          # Submodule URLs use SSH; rewrite to anonymous HTTPS (public repos).
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone https://github.com/UE4SS-RE/RE-UE4SS.git RE-UE4SS
          Push-Location RE-UE4SS
          git checkout $env:RE_UE4SS_COMMIT
          git submodule update --init deps/first/patternsleuth
          Pop-Location

      - name: Fetch UEPseudo headers from public mirror
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/BlackBookOfficial/ue4ss-linux-palworld.git uepseudo_mirror
          Push-Location uepseudo_mirror
          git sparse-checkout set deps/first/Unreal
          Pop-Location
          # RE-UE4SS 的 deps/first/Unreal 是未初始化 submodule（空目录已存在），
          # Copy-Item 到已存在目录会嵌套成 Unreal/Unreal/；先删除再复制。
          Remove-Item "RE-UE4SS\deps\first\Unreal" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "uepseudo_mirror\deps\first\Unreal" "RE-UE4SS\deps\first\Unreal" -Recurse
          Write-Host "UEPseudo headers fetched from public mirror"
          if (-not (Test-Path "RE-UE4SS\deps\first\Unreal\CMakeLists.txt")) {
            throw "Unreal CMakeLists.txt missing after copy (nesting bug?)"
          }
          if (-not (Test-Path "RE-UE4SS\deps\first\Unreal\include\Unreal\NameTypes.hpp")) {
            throw "Unreal headers missing after copy"
          }
          Write-Host "Unreal verified: CMakeLists.txt + headers present"

      - name: Inject mod into RE-UE4SS tree
        shell: pwsh
        run: |
          $modDir = "RE-UE4SS\cppmods\$env:MOD_NAME"
          $srcDir = "$modDir\src"
          New-Item -ItemType Directory -Force -Path $srcDir | Out-Null
          Copy-Item src\CMakeLists.txt "$modDir\CMakeLists.txt" -Force
          Copy-Item src\dllmain.cpp "$srcDir\dllmain.cpp" -Force
          # Register mod in cppmods/CMakeLists.txt
          $cppmodsCmake = "RE-UE4SS\cppmods\CMakeLists.txt"
          $content = Get-Content $cppmodsCmake -Raw
          if ($content -notmatch [regex]::Escape($env:MOD_NAME)) {
              $content = $content.Replace(
                  'add_subdirectory("EventViewerMod")',
                  "add_subdirectory(`"EventViewerMod`")`nadd_subdirectory(`"$($env:MOD_NAME)`")"
              )
              Set-Content $cppmodsCmake $content
              Write-Host "added add_subdirectory($($env:MOD_NAME)) to cppmods/CMakeLists.txt"
          }
          Write-Host "mod injected into $modDir"

      - name: Configure CMake
        shell: pwsh
        run: |
          $env:FETCHCONTENT_BASE_DIR = "${{ github.workspace }}/build_cmake_shared_deps/_deps"
          cmake -B build_cmake_msvc_$env:CONFIG `
            -S RE-UE4SS `
            -G Ninja `
            -DCMAKE_BUILD_TYPE="$env:CONFIG" `
            -DCMAKE_C_COMPILER="cl" `
            -DCMAKE_CXX_COMPILER="cl" `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DFETCHCONTENT_QUIET=OFF

      - name: Build mod
        shell: pwsh
        run: |
          cmake --build build_cmake_msvc_$env:CONFIG --target $env:MOD_NAME --verbose

      - name: Assemble installable mod
        shell: pwsh
        run: |
          $buildDir = "build_cmake_msvc_$env:CONFIG"
          $dll = Get-ChildItem -Path $buildDir -Recurse -Filter "$env:MOD_NAME.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notlike "*\_deps\*" } |
            Select-Object -First 1
          if (-not $dll) {
            Write-Host "DLL not found. All DLLs in build dir:"
            Get-ChildItem -Path $buildDir -Recurse -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "compiled $env:MOD_NAME.dll not found"
          }
          Write-Host "found dll: $($dll.FullName)"
          $dist = "dist\$env:MOD_NAME"
          New-Item -ItemType Directory -Force -Path "$dist\dlls" | Out-Null
          Copy-Item $dll.FullName "$dist\dlls\main.dll" -Force
          New-Item -ItemType File -Force -Path "$dist\enabled.txt" | Out-Null
          # Use the repo's config.txt (with full Chinese comments) instead of an empty file,
          # so users get an explained config in the packaged artifact.
          if (Test-Path "$dist\config.txt") {
            Write-Host "using repo config.txt (preserved)"
          } else {
            Write-Host "WARNING: dist/$env:MOD_NAME/config.txt missing in repo -> creating empty"
            New-Item -ItemType File -Force -Path "$dist\config.txt" | Out-Null
          }
          if (Test-Path "$env:MOD_NAME.zip") { Remove-Item "$env:MOD_NAME.zip" -Force }
          Compress-Archive -Path "$dist\*" -DestinationPath "$env:MOD_NAME.zip" -Force
          Write-Host "assembled $dist + $env:MOD_NAME.zip"

      - name: Upload mod folder
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}
          path: dist\${{ env.MOD_NAME }}

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}.zip
          path: ${{ env.MOD_NAME }}.zip
